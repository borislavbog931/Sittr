{% load static %}
{% with url_name=request.resolver_match.url_name %}
<a href="{% url 'home' %}" class="brand-link">
  <span class="brand-mark">
    <img src="{% static 'images/logo.png' %}" alt="Sittr">
  </span>
  <span class="brand-copy">
    <strong>Sittr</strong>
    <span>Trusted pet care</span>
  </span>
</a>

<div class="stack" style="margin-top: 20px;">
  <a class="nav-link {% if url_name == 'home' %}is-active{% endif %}" href="{% url 'home' %}">
    <svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg> Home
  </a>

  <a class="nav-link {% if url_name == 'about' %}is-active{% endif %}" href="{% url 'about' %}">
    <svg class="icon" aria-hidden="true"><use href="#icon-info-circle"></use></svg> About
  </a>

  <a class="nav-link {% if url_name == 'caretaker_list' or url_name == 'caretaker_detail' or url_name == 'caretaker_create' or url_name == 'caretaker_edit' or url_name == 'caretaker_delete' %}is-active{% endif %}" href="{% url 'caretaker_list' %}">
    <svg class="icon" aria-hidden="true"><use href="#icon-people"></use></svg> Caretakers
  </a>

  <a class="nav-link {% if url_name == 'service_list' or url_name == 'service_detail' or url_name == 'service_create' or url_name == 'service_edit' or url_name == 'service_delete' %}is-active{% endif %}" href="{% url 'service_list' %}">
    <svg class="icon" aria-hidden="true"><use href="#icon-briefcase"></use></svg> Services
  </a>

  <a class="nav-link {% if url_name == 'hire_request_list' or url_name == 'hire_request_detail' or url_name == 'hire_request_create' or url_name == 'hire_request_create_general' %}is-active{% endif %}" href="{% url 'hire_request_list' %}">
    <svg class="icon" aria-hidden="true"><use href="#icon-envelope-paper"></use></svg> Requests
  </a>

  <a class="nav-link {% if url_name == 'review_list' or url_name == 'review_detail' or url_name == 'review_create' or url_name == 'review_create_general' %}is-active{% endif %}" href="{% url 'review_list' %}">
    <svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg> Reviews
  </a>
</div>

<div class="feature-card" style="margin-top: 20px;">
  <span class="eyebrow">Tip</span>
  <p class="muted">Start with caretakers, then narrow the list using service, pet type, and price.</p>
</div>
{% endwith %}
