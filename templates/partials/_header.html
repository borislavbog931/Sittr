{% load static %}
{% with url_name=request.resolver_match.url_name %}
<div class="container-wide">
  <div class="header-inner">
    <a href="{% url 'home' %}" class="brand-link">
      <span class="brand-mark">
        <img src="{% static 'images/logo.png' %}" alt="Sittr">
      </span>
      <span class="brand-copy">
        <strong>Sittr</strong>
        <span>Trusted pet care</span>
      </span>
    </a>

    <nav class="site-nav primary-nav">
      <a href="{% url 'home' %}" class="nav-link {% if url_name == 'home' %}is-active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="#icon-home"></use></svg> Home
      </a>

      <div class="dropdown">
        <button
          type="button"
          class="nav-button {% if url_name == 'caretaker_list' or url_name == 'caretaker_detail' or url_name == 'caretaker_create' or url_name == 'caretaker_edit' or url_name == 'caretaker_delete' %}is-active{% endif %}"
          aria-expanded="false"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-people"></use></svg> Caretakers
          <svg class="icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
        </button>

        <ul class="dd-menu">
          <li>
            <a class="dd-item" href="{% url 'caretaker_list' %}">
              <svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg> All caretakers
            </a>
          </li>
          <li>
            <a class="dd-item" href="{% url 'caretaker_create' %}">
              <svg class="icon" aria-hidden="true"><use href="#icon-plus-circle"></use></svg> Add caretaker
            </a>
          </li>
        </ul>
      </div>

      <a href="{% url 'service_list' %}" class="nav-link {% if url_name == 'service_list' or url_name == 'service_detail' or url_name == 'service_create' or url_name == 'service_edit' or url_name == 'service_delete' %}is-active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="#icon-briefcase"></use></svg> Services
      </a>

      <a href="{% url 'review_list' %}" class="nav-link {% if url_name == 'review_list' or url_name == 'review_detail' or url_name == 'review_create' or url_name == 'review_create_general' %}is-active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="#icon-star"></use></svg> Reviews
      </a>

      <a href="{% url 'hire_request_list' %}" class="nav-link {% if url_name == 'hire_request_list' or url_name == 'hire_request_detail' or url_name == 'hire_request_create' or url_name == 'hire_request_create_general' %}is-active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="#icon-envelope-paper"></use></svg> Requests
      </a>

      <a href="{% url 'about' %}" class="nav-link {% if url_name == 'about' %}is-active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="#icon-info-circle"></use></svg> About
      </a>
    </nav>

    <div class="site-badges">
      <span class="site-badge"><svg class="icon" aria-hidden="true"><use href="#icon-shield-check"></use></svg> Verified reviews</span>
      <span class="site-badge"><svg class="icon" aria-hidden="true"><use href="#icon-lightning-charge"></use></svg> No account needed</span>
    </div>
  </div>
</div>

{% endwith %}
